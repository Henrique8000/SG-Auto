spring:

  profiles:
    active: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/sgauto
    username: postgres
    password: 1234567

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    out-of-order: true
    validate-on-migrate: true
    clean-disabled: true
    locations: classpath:db/migration